<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grammateus - Sistema Docente Profesional Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF7EF; --paper-dim:#F1ECDE; --ink:#22291D; --ink-soft:#5B6355;
    --line:#DAD2BC; --card:#FFFFFF; --green:#2F6F4E; --green-dark:#204E37;
    --green-pale:#E4EFE6; --red:#A23A2C; --red-pale:#F3E2DE; --gold:#B4842A; --gold-pale:#F3E9D3;
    --shadow:0 8px 24px rgba(34,41,29,.07); --shadow-soft:0 4px 6px -1px rgba(0,0,0,.05),0 12px 24px -16px rgba(34,41,29,.12);
    --radius:10px;
  }
  *{box-sizing:border-box;} html,body{margin:0;padding:0;height:100%;}
  body{background:linear-gradient(180deg,#fbf9f3 0%,var(--paper) 100%);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,.serif{font-family:'Lora',serif;} button{font-family:inherit;cursor:pointer;border-radius:10px;} input,select{font-family:inherit;}

  #app {max-width:none;padding:0;min-height:100vh;}
  .topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:18px;min-height:70px;padding:12px 28px;margin:0;background:rgba(250,247,239,.96);backdrop-filter:blur(12px);border-bottom:1px solid rgba(218,210,188,.65);box-shadow:0 2px 10px rgba(34,41,29,.035);}
  .brand{flex:0 0 auto;align-items:center;gap:11px;display:flex;cursor:pointer;transition:opacity 0.2s;}
  .brand:hover{opacity:0.8;}
  .brand h1{font-family:'Lora',serif;font-size:24px;line-height:1;margin:0;}
  .brand span{font-family:'Inter',sans-serif;font-size:11.5px;color:var(--ink-soft);}
  .brand-mark{width:38px;height:38px;border-radius:10px;background:var(--green);color:#fff;display:grid;place-items:center;font-family:Lora,serif;font-weight:700;font-size:20px;}
  .top-actions{display:flex;align-items:center;gap:7px;margin-left:auto;}
  .btn{font-family:'Inter',sans-serif;border:0;border-radius:10px;padding:9px 14px;box-shadow:var(--shadow-soft);font-size:13px;font-weight:600;background:var(--card);color:var(--ink);cursor:pointer;}
  .btn:hover{transform:translateY(-1px);}
  .btn-primary{background:var(--green)!important;color:#fff!important;box-shadow:0 4px 12px rgba(47,111,78,.18);}
  .btn-danger{background:var(--red)!important;color:#fff!important;}
  .btn-ghost{background:transparent!important;box-shadow:none!important;}
  .btn-sm{padding:5px 10px;font-size:12px;}
  
  .profile-wrap{position:relative;}
  .profile-btn{display:flex;align-items:center;gap:8px;background:#fff;color:var(--ink);}
  .avatar{width:30px;height:30px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;}
  .profile-name{font-size:12.5px;max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .profile-menu{position:absolute;right:0;top:44px;width:210px;background:#fff;border-radius:12px;box-shadow:0 18px 45px rgba(34,41,29,.14);padding:6px;display:none;z-index:60;}
  .profile-menu.open{display:block;}
  .profile-menu button{width:100%;border:0;background:transparent;text-align:left;padding:10px 11px;font-size:13px;color:var(--ink);border-radius:8px;display:flex;align-items:center;gap:8px;}
  .profile-menu button:hover{background:var(--paper-dim);}

  .layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:0;min-height:calc(100vh - 70px);}
  .tree-panel{position:sticky;top:70px;align-self:start;height:calc(100vh - 70px);overflow:auto;background:#F3EFE5;padding:24px 16px 40px;border-right:1px solid var(--line);}
  .tree-head{padding:0 8px 10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
  .tree-head h3{font-family:'Inter',sans-serif;font-size:11px;letter-spacing:.08em;margin:0;color:var(--ink-soft);text-transform:uppercase;}
  .grade-block{border:0;border-radius:10px;background:#fff;box-shadow:var(--shadow-soft);margin-bottom:10px;overflow:hidden;}
  .grade-row{background:transparent;padding:11px 10px;display:flex;align-items:center;gap:6px;}
  .grade-row .caret{border:none;background:none;font-size:11px;color:var(--ink-soft);padding:2px 4px;cursor:pointer;}
  .grade-row .gname{flex:1;font-weight:700;font-size:14px;}
  .group-item{border-top:1px solid #eeeae0;padding:9px 9px 9px 27px;background:transparent;display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;}
  .group-item:hover{background:#f8f6ef;}
  .group-item.active{background:var(--green-pale);box-shadow:inset 3px 0 var(--green);}
  .group-main{flex:1;display:flex;justify-content:space-between;align-items:center;gap:6px;text-align:left;border:0;background:transparent;color:inherit;font:inherit;padding:0;cursor:pointer;}
  .add-group-row{border-top:1px solid #eeeae0;}
  .add-group-row button{border-radius:0;width:100%;background:transparent;border:none;padding:9px 10px 9px 27px;font-size:13px;color:var(--green-dark);font-weight:600;text-align:left;}
  .add-group-row button:hover{background:var(--green-pale);}

  .main-content{min-width:0;padding:28px 34px 70px;max-width:1250px;width:100%;margin:0 auto;}
  .tabs-row{display:flex;gap:3px;border-bottom:1px solid #e5dfd0;margin-bottom:24px;overflow-x:auto;}
  .tabs-row button{border-radius:0;background:transparent;border:none;border-bottom:3px solid transparent;padding:11px 12px;font-size:14.5px;font-weight:600;color:var(--ink-soft);white-space:nowrap;}
  .tabs-row button.active{color:var(--ink);border-bottom-color:var(--green);}
  .panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
  .panel-head h2{font-family:'Lora',serif;margin:0;font-size:22px;}
  .inline-form{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end;}
  .inline-form input{border:0;box-shadow:inset 0 0 0 1px #e5dfd0,0 2px 7px rgba(34,41,29,.03);border-radius:10px;padding:9px 11px;font-size:14px;color:var(--ink);background:#fff;outline:none;}
  table{width:100%;border-collapse:collapse;background:var(--card);}
  th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:14px;}
  th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);font-weight:600;border-bottom:2px solid var(--ink);}
  tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#fcfbf7;}
  .num{text-align:right;font-variant-numeric:tabular-nums;}
  .table-wrap{border:0;box-shadow:var(--shadow-soft);border-radius:12px;overflow:hidden;background:#fff;margin-bottom:20px;}
  .pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:12.5px;font-weight:600;}
  .pill-green{background:var(--green-pale);color:var(--green-dark);}
  .pill-red{background:var(--red-pale);color:var(--red);}
  .pill-gray{background:var(--paper-dim);color:var(--ink-soft);}

  .home-grid{display:grid;grid-template-columns:1fr;gap:20px;}
  .card-box{background:#fff;padding:22px;border-radius:14px;box-shadow:var(--shadow-soft);margin-bottom:20px;}
  .card-box h3{margin-top:0;font-family:'Lora',serif;font-size:18px;color:var(--green-dark);display:flex;align-items:center;gap:8px;}
  
  /* CALENDARIO REAL INTERACTIVO INTEGRADO */
  .calendar-container{background:#fff;padding:24px;border-radius:14px;box-shadow:var(--shadow-soft);margin-top:20px;}
  .calendar-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
  .calendar-grid{display:grid;grid-template-columns:repeat(7, 1fr);gap:6px;text-align:center;}
  .cal-day-name{font-weight:700;font-size:12px;color:var(--ink-soft);padding:8px 0;text-transform:uppercase;}
  .cal-cell{min-height:75px;border:1px solid var(--line);border-radius:8px;padding:6px;background:#fcfbf7;display:flex;flex-direction:column;justify-content:space-between;font-size:13px;}
  .cal-cell.today{border-color:var(--green);background:var(--green-pale);font-weight:bold;}
  .cal-cell.empty{background:transparent;border:none;}
  .cal-date-num{font-weight:700;font-size:12px;align-self:flex-start;}
  .cal-event-tag{background:var(--gold-pale);color:var(--gold);font-size:10px;padding:2px 4px;border-radius:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px;}

  #undoToast {
    position: fixed; bottom: 20px; right: 20px; background: #22291D; color: #fff;
    padding: 12px 20px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    display: none; align-items: center; gap: 15px; z-index: 1000; font-size: 14px;
  }
  #undoToast button { background: var(--green); color: #fff; border: 0; padding: 5px 10px; border-radius: 6px; font-weight: bold; cursor: pointer; }

  .status-btns{display:flex;gap:4px;flex-wrap:wrap;}
  .status-btn{border:1.5px solid var(--line);background:var(--card);border-radius:6px;padding:5px 9px;font-size:12.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;}
  .status-btn.on-present{border-color:var(--green);color:var(--green);background:var(--green-pale);}
  .status-btn.on-absent{border-color:var(--red);color:var(--red);background:var(--red-pale);}
  .status-btn.on-late{border-color:var(--gold);color:var(--gold);background:var(--gold-pale);}

  .modal-backdrop{position:fixed;inset:0;background:rgba(34,41,29,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal{background:var(--card);border-radius:14px;padding:22px;max-width:500px;width:100%;box-shadow:0 24px 70px rgba(0,0,0,.18);}
  .modal h3{margin:0 0 4px;font-family:'Lora',serif;}
  .modal .hint{font-size:12.5px;color:var(--ink-soft);margin:0 0 16px;}
  .modal .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
  .modal input{width:100%;padding:9px 10px;border:0;box-shadow:inset 0 0 0 1px #e5dfd0,0 2px 7px rgba(34,41,29,.03);border-radius:10px;font-size:14px;margin-top:4px;background:#fff;outline:none;}
  .field-label{font-size:12.5px;font-weight:600;color:var(--ink-soft);display:block;margin-top:10px;}
  .points-form{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--card);border:0;box-shadow:var(--shadow-soft);border-radius:var(--radius);padding:14px;margin-bottom:16px;}
  .toggle-sign{display:flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden;}
  .toggle-sign button{border:none;background:var(--card);padding:8px 14px;font-weight:700;font-size:15px;color:var(--ink-soft);border-radius:0;}
  .toggle-sign button.active-plus{background:var(--green);color:#fff;}
  .toggle-sign button.active-minus{background:var(--red);color:#fff;}
  .edit-course-list{max-height:300px;overflow-y:auto;margin-bottom:16px;}
  .edit-course-card{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px;}
  .edit-course-card h4{margin:0 0 8px 0;display:flex;justify-content:space-between;align-items:center;}
  .edit-course-card ul{list-style:none;padding:0;margin:0;}
  .edit-course-card li{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:1px dashed var(--line);font-size:13.5px;}
  
  @media print {
    body { background: #fff; color: #000; }
    .topbar, .tree-panel, .tabs-row, .inline-form, .btn, .points-form, #undoToast { display: none !important; }
    .main-content { padding: 0 !important; max-width: 100% !important; }
    .table-wrap { box-shadow: none !important; border: 1px solid #000 !important; }
    th { background: #eee !important; color: #000 !important; border-bottom: 2px solid #000 !important; }
  }

  @media(max-width:800px){.topbar{padding:10px 14px;min-height:64px;flex-wrap:wrap;}.layout{display:block;min-height:0;}.tree-panel{display:none;padding:14px;}.tree-panel.mobile-open{display:block;}.mobile-menu{display:inline-flex;}.main-content{padding:22px 14px 50px;}}
</style>
</head>
<body>
  <div id="app"></div>
  <div id="undoToast"><span>Acción realizada.</span><button id="undoBtn">Deshacer</button></div>

<script>
  /* 
     GRAMMATEUS - SISTEMA DOCENTE PROFESIONAL PRO (VERSIÓN AMPLIADA Y ROBUSTA)
     Módulos integrados: 
     - Gestión de Perfil de Usuario con cambio de Nombre en Vivo.
     - Calendario Escolar Mensual Interactivo (MINERD 2026-2027) totalmente visible.
     - Estructura completa de Grados, Asignaturas, Secciones y Alumnos.
     - Registro de Asistencia por Historial y Fechas Pasadas.
     - Sistema de Puntos, Méritos y Faltas Leves/Graves con selector dinámico y opción de motivo personalizado ("Otro").
     - Reportes automáticos y análisis estadístico de incidencias comunes.
     - Fichas individuales cronológicas para cada estudiante.
     - Motor de Impresión optimizado para reportes en papel o PDF.
     - Funcionalidad de Deshacer (Undo) instantánea para prevenir errores táctiles.
  */

  function initApp() {
    var STORAGE_KEY = "grammateus-data-v7-pro";
    var state = {
      userName: "Profesor",
      grades: [], groups: [], students: [], points: [], attendance: [],
      selectedGroup: null, collapsedGrades: {}, activeTab: "estudiantes", attendanceDate: todayISO(),
      currentCalYear: 2026, currentCalMonth: 8 // Septiembre por defecto (0-indexado)
    };

    var lastAction = null;

    function todayISO(){
      var d=new Date(),m=(d.getMonth()+1+"").padStart(2,"0"),day=(d.getDate()+"").padStart(2,"0");
      return d.getFullYear()+"-"+m+"-"+day;
    }
    function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
    function escapeHtml(s){return (s+"").replace(/[&<>"']/g, function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}

    var saveTimer = null;
    function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(save,250);}
    function storageSet(value){try{localStorage.setItem(STORAGE_KEY, value);}catch(e){}return Promise.resolve();}
    function storageGet(){var value=null;try{value=localStorage.getItem(STORAGE_KEY);}catch(e){}return Promise.resolve(value?{value:value}:null);}
    
    function save(){
      var data={
        userName: state.userName, grades:state.grades, groups:state.groups, 
        students:state.students, points:state.points, attendance:state.attendance, 
        selectedGroup:state.selectedGroup, collapsedGrades:state.collapsedGrades
      };
      storageSet(JSON.stringify(data));
    }
    
    function load(){
      storageGet().then(function(res){
        if(res && res.value){
          try{
            var data = JSON.parse(res.value);
            Object.assign(state, data);
            if(data.userName) state.userName = data.userName;
            state.grades=Array.isArray(state.grades)?state.grades:[]; 
            state.groups=Array.isArray(state.groups)?state.groups:[];
            state.students=Array.isArray(state.students)?state.students:[]; 
            state.points=Array.isArray(state.points)?state.points:[];
            state.attendance=Array.isArray(state.attendance)?state.attendance:[];
          }catch(e){}
        }
        if(!state.selectedGroup || !state.groups.some(function(g){return g.id===state.selectedGroup;})) state.selectedGroup = null;
        render();
      }).catch(function(){ render(); });
    }

    function showUndo(msg, undoCallback){
      var toast = document.getElementById("undoToast");
      toast.querySelector("span").textContent = msg;
      toast.style.display = "flex";
      lastAction = undoCallback;
      setTimeout(function(){ toast.style.display = "none"; }, 4000);
    }

    document.getElementById("undoBtn").addEventListener("click", function(){
      if(lastAction){ lastAction(); lastAction = null; document.getElementById("undoToast").style.display = "none"; save(); render(); }
    });

    function groupsInGrade(gradeId){ return state.groups.filter(function(g){ return g.gradeId===gradeId; }); }
    function groupStudents(groupId){ return state.students.filter(function(s){ return s.groupId===groupId; }); }
    function currentStudents(){ return state.selectedGroup ? groupStudents(state.selectedGroup) : []; }
    function groupLabel(g){if(!g)return"";if(g.subject&&g.section)return g.subject+" · Sección "+g.section;if(g.subject)return g.subject;if(g.section)return "Sección "+g.section;return "General";}

    function addGrade(name){if(!name||!name.trim())return null;var g={id:uid(),name:name.trim()};state.grades.push(g);scheduleSave();render();return g;}
    function deleteGrade(id){
      var groupIds = groupsInGrade(id).map(function(g){return g.id;});
      groupIds.forEach(cascadeDeleteGroupData);
      state.groups = state.groups.filter(function(g){return g.gradeId!==id;});
      state.grades = state.grades.filter(function(g){return g.id!==id;});
      if(groupIds.indexOf(state.selectedGroup)!==-1) state.selectedGroup = null;
      scheduleSave();
    }
    function addGroup(gradeId, sub, sec){if(!gradeId)return null;var g={id:uid(),gradeId:gradeId,subject:(sub||"").trim(),section:(sec||"").trim()};state.groups.push(g);state.selectedGroup=g.id;scheduleSave();render();return g;}
    function cascadeDeleteGroupData(groupId){
      var studentIds = groupStudents(groupId).map(function(s){return s.id;});
      state.students=state.students.filter(function(s){return s.groupId!==groupId;});
      state.points=state.points.filter(function(p){return studentIds.indexOf(p.studentId)===-1;});
    }
    function deleteGroup(id){
      cascadeDeleteGroupData(id);
      state.groups=state.groups.filter(function(g){return g.id!==id;});
      if(state.selectedGroup===id) state.selectedGroup = null;
      scheduleSave();
    }
    function addStudent(name){
      if(!name||!name.trim()||!state.selectedGroup)return;
      var newSt = {id:uid(),groupId:state.selectedGroup,name:name.trim()};
      state.students.push(newSt);
      showUndo("Estudiante agregado.", function(){ state.students = state.students.filter(function(s){return s.id!==newSt.id;}); });
      scheduleSave(); render();
    }
    function deleteStudent(id){
      var stIndex = state.students.findIndex(function(s){return s.id===id;});
      if(stIndex===-1) return;
      var removed = state.students[stIndex];
      state.students.splice(stIndex,1);
      showUndo("Estudiante eliminado.", function(){ state.students.splice(stIndex, 0, removed); });
      scheduleSave(); render();
    }
    function addPoints(studentId, amount, reason){
      if(!studentId || !amount) return;
      var newP = {id:uid(), studentId:studentId, amount:amount, reason:(reason||"General").trim(), date:todayISO()};
      state.points.push(newP);
      showUndo("Registro guardado.", function(){ state.points = state.points.filter(function(p){return p.id!==newP.id;}); });
      scheduleSave(); render();
    }

    function setAttendance(studentId, status){
      var rec = state.attendance.find(function(a){return a.groupId===state.selectedGroup && a.date===state.attendanceDate;});
      if(!rec){ rec = {id:uid(), groupId:state.selectedGroup, date:state.attendanceDate, records:{}}; state.attendance.push(rec); }
      var prevStatus = rec.records[studentId];
      if(prevStatus === status) delete rec.records[studentId];
      else rec.records[studentId] = status;
      
      showUndo("Asistencia actualizada.", function(){
        if(prevStatus) rec.records[studentId] = prevStatus;
        else delete rec.records[studentId];
      });
      scheduleSave(); render();
    }

    function el(html){var t=document.createElement("template");t.innerHTML=html.trim();return t.content.firstChild;}

    function render(){
      var app = document.getElementById("app");
      app.innerHTML = "";
      app.appendChild(renderTopbar());

      var layout = el('<div class="layout"></div>');
      layout.appendChild(renderTree());
      var mainCol = el('<div class="main-content"></div>');
      layout.appendChild(mainCol);
      app.appendChild(layout);

      var group = state.groups.find(function(g){return g.id===state.selectedGroup;});
      
      if(!group){
        mainCol.appendChild(renderHomeDashboard());
        return;
      }

      var grade = state.grades.find(function(gr){return gr.id===group.gradeId;});
      var bc = el('<div class="breadcrumb"><span class="breadcrumb-home" id="bcHome" style="cursor:pointer;color:var(--green);font-weight:600;">Inicio</span> ❯ <strong>Gestión de Grados</strong> ❯ <span class="current">'+escapeHtml(grade?grade.name:"")+' · '+escapeHtml(groupLabel(group))+'</span></div>');
      bc.querySelector("#bcHome").addEventListener("click", function(){ state.selectedGroup = null; render(); });
      mainCol.appendChild(bc);
      
      mainCol.appendChild(renderTabsRow());
      var main = el('<main></main>');
      mainCol.appendChild(main);
      switch(state.activeTab){
        case "estudiantes": main.appendChild(renderEstudiantes()); break;
        case "asistencia": main.appendChild(renderAsistencia()); break;
        case "puntos": main.appendChild(renderPuntos()); break;
        case "reportes": main.appendChild(renderReportes()); break;
        default: main.appendChild(renderEstudiantes());
      }
    }

    // CALENDARIO REAL MINERD INTERACTIVO
    function renderHomeDashboard(){
      var wrap = el('<div></div>');
      var totalStudents = state.students.length;
      var totalGroups = state.groups.length;

      var monthsNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
      
      var calBox = el('<div></div>');
      
      function buildCalendarHTML(year, month){
        var firstDayIndex = new Date(year, month, 1).getDay();
        var totalDays = new Date(year, month + 1, 0).getDate();
        
        // Feriados oficiales MINERD 2026-2027 integrados
        var holidays = {
          "2026-8-16": "Restauración", "2026-8-24": "Inicio Clases", "2026-9-24": "Ntra. Sra. Mercedes",
          "2026-11-9": "Día Constitución", "2026-12-25": "Navidad", "2027-1-1": "Año Nuevo",
          "2027-1-21": "Día Altagracia", "2027-1-25": "Duarte", "2027-2-27": "Independencia",
          "2027-3-26": "Viernes Santo", "2027-5-3": "Día del Trabajo", "2027-5-27": "Corpus Christi", "2027-6-18": "Cierre Clases"
        };

        var html = '<div class="calendar-container">'+
          '<div class="calendar-header">'+
            '<button class="btn btn-sm" id="prevMonth">◀ Mes Anterior</button>'+

                '<option value="Trabajo en equipo sobresaliente">Trabajo en equipo sobresaliente</option>'+

    function renderReportes(){
      var wrap = el('<div></div>');
      var students = currentStudents();
      wrap.appendChild(el('<div class="panel-head"><h2>Reportes y Estadísticas del Grupo</h2></div>'));
      
      if(!students.length){
        wrap.appendChild(el('<div class="empty"><h2>Agrega estudiantes primero</h2></div>'));
        return wrap;
      }

      var commonReasons = {};
      state.points.forEach(function(p){
        if(students.some(function(s){return s.id===p.studentId;})){
          commonReasons[p.reason] = (commonReasons[p.reason] || 0) + 1;
        }
      });

      var summaryBox = el('<div style="background:#fff; padding:16px; border-radius:12px; box-shadow:var(--shadow-soft); margin-bottom:20px;">'+
        '<h3 style="margin-top:0; font-size:16px; color:var(--green-dark);">Razones e Incidencias Más Comunes</h3>'+
        '<div id="commonReasonsList" style="display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;"></div>'+
      '</div>');

      var reasonsListDiv = summaryBox.querySelector("#commonReasonsList");
      var sortedReasons = Object.keys(commonReasons).sort(function(a,b){return commonReasons[b]-commonReasons[a];});
      if(!sortedReasons.length){
        reasonsListDiv.innerHTML = '<span style="font-size:13px; color:var(--ink-soft);">Aún no hay reportes registrados para analizar.</span>';
      } else {
        sortedReasons.forEach(function(r){
          reasonsListDiv.appendChild(el('<span style="background:var(--paper-dim); padding:6px 12px; border-radius:8px; font-size:13px;"><strong>'+escapeHtml(r)+':</strong> '+commonReasons[r]+' vez(ces)</span>'));
        });
      }
      wrap.appendChild(summaryBox);

      var tableWrap = el('<div class="table-wrap"></div>');
      var table = el('<table><thead><tr><th>Estudiante</th><th class="num">Total Puntos</th><th class="num">Total Faltas / Sanciones</th><th class="num">Balance Neto</th></tr></thead></table>');
      var tbody = document.createElement("tbody");

      students.forEach(function(s){
        var sPoints = state.points.filter(function(p){return p.studentId===s.id;});
        var pos = sPoints.filter(function(p){return p.amount>0;}).reduce(function(a,b){return a+b.amount;},0);
        var neg = sPoints.filter(function(p){return p.amount<0;}).reduce(function(a,b){return a+b.amount;},0);
        var balance = pos + neg;
        var balancePill = balance > 0 ? "pill-green" : (balance < 0 ? "pill-red" : "pill-gray");

        tbody.appendChild(el('<tr><td><strong style="cursor:pointer;color:var(--green);" class="st-link">'+escapeHtml(s.name)+'</strong></td><td class="num" style="color:var(--green);">+'+pos+'</td><td class="num" style="color:var(--red);">'+neg+'</td><td class="num"><span class="pill '+balancePill+'">'+(balance>0?"+":"")+balance+'</span></td></tr>'));
        tbody.lastChild.querySelector(".st-link").addEventListener("click", function(){ openStudentProfileModal(s); });
      });

      table.appendChild(tbody); tableWrap.appendChild(table); wrap.appendChild(tableWrap);
      return wrap;
    }

        list.innerHTML = "";
        if(!state.grades.length){ list.innerHTML = "<p style='color:var(--ink-soft);font-size:14px;'>No hay grados para editar.</p>"; return; }
        
        state.grades.forEach(function(grade){
          var gBlock = el('<div class="edit-course-card"></div>');
          var gHead = el('<h4><span>'+escapeHtml(grade.name)+'</span><button class="btn btn-sm btn-danger">Borrar Grado</button></h4>');
          gHead.querySelector('button').addEventListener("click", function(){
            if(confirm("¿Borrar el grado '"+grade.name+"' y todos sus grupos?")){ deleteGrade(grade.id); renderList(); render(); }
          });
          gBlock.appendChild(gHead);

          var groups = groupsInGrade(grade.id);
          if(groups.length > 0){
             var ul = el('<ul></ul>');
             groups.forEach(function(grp){
               var li = el('<li><span>'+escapeHtml(groupLabel(grp))+'</span><button class="btn btn-ghost btn-sm" style="color:var(--red);">Eliminar</button></li>');
               li.querySelector('button').addEventListener("click", function(){
                  if(confirm("¿Borrar asignatura '"+groupLabel(grp)+"'?")){ deleteGroup(grp.id); renderList(); render(); }
               });
               ul.appendChild(li);
             });
             gBlock.appendChild(ul);
          } else {
             gBlock.appendChild(el('<p style="margin:0;font-size:12.5px;color:var(--ink-soft);">No hay asignaturas.</p>'));
          }
          list.appendChild(gBlock);
        });
      }
      renderList();
      modal.querySelector("#closeEditCourses").addEventListener("click", function(){ document.body.removeChild(backdrop); });
    }

    load();
  }
  
  window.addEventListener('DOMContentLoaded', initApp);
</script>
</body>
</html>
