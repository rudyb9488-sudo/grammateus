<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grammateus - Sistema Docente Profesional Pro Master Enterprise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF7EF; --paper-dim:#F1ECDE; --ink:#22291D; --ink-soft:#5B6355;
    --line:#DAD2BC; --card:#FFFFFF; --green:#2F6F4E; --green-dark:#204E37;
    --green-pale:#E4EFE6; --red:#A23A2C; --red-pale:#F3E2DE; --gold:#B4842A; --gold-pale:#F3E9D3;
    --shadow:0 8px 24px rgba(34,41,29,.07); --shadow-soft:0 4px 6px -1px rgba(0,0,0,.05),0 12px 24px -16px rgba(34,41,29,.12);
    --radius:10px;
  }
  *{box-sizing:border-box;} html,body{margin:0;padding:0;height:100%;}
  body{background:linear-gradient(180deg,#fbf9f3 0%,var(--paper) 100%);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,.serif{font-family:'Lora',serif;} button{font-family:inherit;cursor:pointer;border-radius:10px;} input,select{font-family:inherit;}

  #app {max-width:none;padding:0;min-height:100vh;}
  .topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:18px;min-height:70px;padding:12px 28px;margin:0;background:rgba(250,247,239,.96);backdrop-filter:blur(12px);border-bottom:1px solid rgba(218,210,188,.65);box-shadow:0 2px 10px rgba(34,41,29,.035);}
  .brand{flex:0 0 auto;align-items:center;gap:11px;display:flex;cursor:pointer;transition:opacity 0.2s;}
  .brand:hover{opacity:0.8;}
  .brand h1{font-family:'Lora',serif;font-size:24px;line-height:1;margin:0;}
  .brand span{font-family:'Inter',sans-serif;font-size:11.5px;color:var(--ink-soft);}
  .brand-mark{width:38px;height:38px;border-radius:10px;background:var(--green);color:#fff;display:grid;place-items:center;font-family:Lora,serif;font-weight:700;font-size:20px;}
  .top-actions{display:flex;align-items:center;gap:7px;margin-left:auto;}
  .btn{font-family:'Inter',sans-serif;border:0;border-radius:10px;padding:9px 14px;box-shadow:var(--shadow-soft);font-size:13px;font-weight:600;background:var(--card);color:var(--ink);cursor:pointer;}
  .btn:hover{transform:translateY(-1px);}
  .btn-primary{background:var(--green)!important;color:#fff!important;box-shadow:0 4px 12px rgba(47,111,78,.18);}
  .btn-danger{background:var(--red)!important;color:#fff!important;}
  .btn-ghost{background:transparent!important;box-shadow:none!important;}
  .btn-sm{padding:5px 10px;font-size:12px;}
  
  .profile-wrap{position:relative;}
  .profile-btn{display:flex;align-items:center;gap:8px;background:#fff;color:var(--ink);}
  .avatar{width:30px;height:30px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;}
  .profile-name{font-size:12.5px;max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .profile-menu{position:absolute;right:0;top:44px;width:210px;background:#fff;border-radius:12px;box-shadow:0 18px 45px rgba(34,41,29,.14);padding:6px;display:none;z-index:60;}
  .profile-menu.open{display:block;}
  .profile-menu button{width:100%;border:0;background:transparent;text-align:left;padding:10px 11px;font-size:13px;color:var(--ink);border-radius:8px;display:flex;align-items:center;gap:8px;}
  .profile-menu button:hover{background:var(--paper-dim);}

  .layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:0;min-height:calc(100vh - 70px);}
  .tree-panel{position:sticky;top:70px;align-self:start;height:calc(100vh - 70px);overflow:auto;background:#F3EFE5;padding:24px 16px 40px;border-right:1px solid var(--line);}
  .tree-head{padding:0 8px 10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
  .tree-head h3{font-family:'Inter',sans-serif;font-size:11px;letter-spacing:.08em;margin:0;color:var(--ink-soft);text-transform:uppercase;}
  .grade-block{border:0;border-radius:10px;background:#fff;box-shadow:var(--shadow-soft);margin-bottom:10px;overflow:hidden;}
  .grade-row{background:transparent;padding:11px 10px;display:flex;align-items:center;gap:6px;}
  .grade-row .caret{border:none;background:none;font-size:11px;color:var(--ink-soft);padding:2px 4px;cursor:pointer;}
  .grade-row .gname{flex:1;font-weight:700;font-size:14px;}
  .group-item{border-top:1px solid #eeeae0;padding:9px 9px 9px 27px;background:transparent;display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;}
  .group-item:hover{background:#f8f6ef;}
  .group-item.active{background:var(--green-pale);box-shadow:inset 3px 0 var(--green);}
  .group-main{flex:1;display:flex;justify-content:space-between;align-items:center;gap:6px;text-align:left;border:0;background:transparent;color:inherit;font:inherit;padding:0;cursor:pointer;}
  .add-group-row{border-top:1px solid #eeeae0;}
  .add-group-row button{border-radius:0;width:100%;background:transparent;border:none;padding:9px 10px 9px 27px;font-size:13px;color:var(--green-dark);font-weight:600;text-align:left;}
  .add-group-row button:hover{background:var(--green-pale);}

  .main-content{min-width:0;padding:28px 34px 70px;max-width:1250px;width:100%;margin:0 auto;}
  .tabs-row{display:flex;gap:3px;border-bottom:1px solid #e5dfd0;margin-bottom:24px;overflow-x:auto;}
  .tabs-row button{border-radius:0;background:transparent;border:none;border-bottom:3px solid transparent;padding:11px 12px;font-size:14.5px;font-weight:600;color:var(--ink-soft);white-space:nowrap;}
  .tabs-row button.active{color:var(--ink);border-bottom-color:var(--green);}
  .panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
  .panel-head h2{font-family:'Lora',serif;margin:0;font-size:22px;}
  .inline-form{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end;}
  .inline-form input{border:0;box-shadow:inset 0 0 0 1px #e5dfd0,0 2px 7px rgba(34,41,29,.03);border-radius:10px;padding:9px 11px;font-size:14px;color:var(--ink);background:#fff;outline:none;}
  table{width:100%;border-collapse:collapse;background:var(--card);}
  th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:14px;}
  th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);font-weight:600;border-bottom:2px solid var(--ink);}
  tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#fcfbf7;}
  .num{text-align:right;font-variant-numeric:tabular-nums;}
  .table-wrap{border:0;box-shadow:var(--shadow-soft);border-radius:12px;overflow:hidden;background:#fff;margin-bottom:20px;}
  .pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:12.5px;font-weight:600;}
  .pill-green{background:var(--green-pale);color:var(--green-dark);}
  .pill-red{background:var(--red-pale);color:var(--red);}
  .pill-gray{background:var(--paper-dim);color:var(--ink-soft);}

  .card-box{background:#fff;padding:22px;border-radius:14px;box-shadow:var(--shadow-soft);margin-bottom:20px;}
  .card-box h3{margin-top:0;font-family:'Lora',serif;font-size:18px;color:var(--green-dark);display:flex;align-items:center;gap:8px;}
  
  .calendar-container{background:#fff;padding:24px;border-radius:14px;box-shadow:var(--shadow-soft);margin-top:20px;}
  .calendar-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
  .calendar-grid{display:grid;grid-template-columns:repeat(7, 1fr);gap:6px;text-align:center;}
  .cal-day-name{font-weight:700;font-size:12px;color:var(--ink-soft);padding:8px 0;text-transform:uppercase;}
  .cal-cell{min-height:75px;border:1px solid var(--line);border-radius:8px;padding:6px;background:#fcfbf7;display:flex;flex-direction:column;justify-content:space-between;font-size:13px;}
  .cal-cell.today{border-color:var(--green);background:var(--green-pale);font-weight:bold;}
  .cal-cell.empty{background:transparent;border:none;}
  .cal-date-num{font-weight:700;font-size:12px;align-self:flex-start;}
  .cal-event-tag{background:var(--gold-pale);color:var(--gold);font-size:10px;padding:2px 4px;border-radius:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px;}

  #undoToast {
    position: fixed; bottom: 20px; right: 20px; background: #22291D; color: #fff;
    padding: 12px 20px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    display: none; align-items: center; gap: 15px; z-index: 1000; font-size: 14px;
  }
  #undoToast button { background: var(--green); color: #fff; border: 0; padding: 5px 10px; border-radius: 6px; font-weight: bold; cursor: pointer; }

  .status-btns{display:flex;gap:4px;flex-wrap:wrap;}
  .status-btn{border:1.5px solid var(--line);background:var(--card);border-radius:6px;padding:5px 9px;font-size:12.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;}
  .status-btn.on-present{border-color:var(--green);color:var(--green);background:var(--green-pale);}
  .status-btn.on-absent{border-color:var(--red);color:var(--red);background:var(--red-pale);}
  .status-btn.on-late{border-color:var(--gold);color:var(--gold);background:var(--gold-pale);}

  .modal-backdrop{position:fixed;inset:0;background:rgba(34,41,29,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal{background:var(--card);border-radius:14px;padding:22px;max-width:500px;width:100%;box-shadow:0 24px 70px rgba(0,0,0,.18);}
  .modal h3{margin:0 0 4px;font-family:'Lora',serif;}
  .modal .hint{font-size:12.5px;color:var(--ink-soft);margin:0 0 16px;}
  .modal .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
  .modal input, .modal select{width:100%;padding:9px 10px;border:0;box-shadow:inset 0 0 0 1px #e5dfd0,0 2px 7px rgba(34,41,29,.03);border-radius:10px;font-size:14px;margin-top:4px;background:#fff;outline:none;}
  .field-label{font-size:12.5px;font-weight:600;color:var(--ink-soft);display:block;margin-top:10px;}
  
  .print-view-only { display: none; }

  @media print {
    body { background: #fff; color: #000; }
    .topbar, .tree-panel, .tabs-row, .inline-form, .btn, .points-form, #undoToast { display: none !important; }
    .main-content { padding: 0 !important; max-width: 100% !important; }
    .table-wrap { box-shadow: none !important; border: 1px solid #000 !important; }
    th { background: #eee !important; color: #000 !important; border-bottom: 2px solid #000 !important; }
    .print-view-only { display: block !important; margin-bottom: 20px; font-family: 'Inter', sans-serif; }
    .no-print { display: none !important; }
  }

  @media(max-width:800px){.topbar{padding:10px 14px;min-height:64px;flex-wrap:wrap;}.layout{display:block;min-height:0;}.tree-panel{display:none;padding:14px;}.tree-panel.mobile-open{display:block;}.mobile-menu{display:inline-flex;}.main-content{padding:22px 14px 50px;}}
</style>
</head>

  /* ==========================================================================

  function initApp() {
    var STORAGE_KEY = "grammateus-data-v15-master";
    var state = {
      userName: "Profesor",
      grades: [], groups: [], students: [], points: [], attendance: [], exams: [], examGrades: [],

    var lastAction = null;

    function todayISO(){var d=new Date(),m=(d.getMonth()+1+"").padStart(2,"0"),day=(d.getDate()+"").padStart(2,"0");return d.getFullYear()+"-"+m+"-"+day;}
    function nowTimeStr(){var d=new Date(); return String(d.getHours()).padStart(2,'0')+":"+String(d.getMinutes()).padStart(2,'0');}
    function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
    function escapeHtml(s){return (s+"").replace(/[&<>"']/g, function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}

    // Corrector estricto para invertir "Apellido Nombre" a "Nombre Apellido"
    function fixNameFormat(rawName) {
      if(!rawName) return "";
      var parts = rawName.trim().replace(/\s+/g, ' ').split(' ');
      if(parts.length <= 2) return rawName;
      // Convención institucional: pasamos el último token o los dos últimos si aplica, 
      // pero aquí reordenamos de forma limpia al estándar Nombre Apellido.
      var first = parts[parts.length - 1];
      var rest = parts.slice(0, parts.length - 1).join(' ');
      return first + ' ' + rest;

    function load(){
      storageGet().then(function(res){
        if(res && res.value){
          try{
            var data = JSON.parse(res.value);
            Object.assign(state, data);
            if(data.userName) state.userName = data.userName;
            state.grades=Array.isArray(state.grades)?state.grades:[]; 
            state.groups=Array.isArray(state.groups)?state.groups:[];
            state.students=Array.isArray(state.students)?state.students:[]; 
            state.points=Array.isArray(state.points)?state.points:[];
            state.attendance=Array.isArray(state.attendance)?state.attendance:[];
            state.exams=Array.isArray(state.exams)?state.exams:[];
            state.examGrades=Array.isArray(state.examGrades)?state.examGrades:[];
          }catch(e){}
        }
        if(state.grades.length === 0){ seedInitialData(); }
        if(!state.selectedGroup || !state.groups.some(function(g){return g.id===state.selectedGroup;})){
          state.selectedGroup = state.groups.length ? state.groups[0].id : null;
        }
        render();
      }).catch(function(){ seedInitialData(); render(); });
    }

    function showUndo(msg, undoCallback){
      var toast = document.getElementById("undoToast");
      toast.querySelector("span").textContent = msg;
      toast.style.display = "flex";
      lastAction = undoCallback;
      setTimeout(function(){ toast.style.display = "none"; }, 4000);
    }

    document.getElementById("undoBtn").addEventListener("click", function(){
      if(lastAction){ lastAction(); lastAction = null; document.getElementById("undoToast").style.display = "none"; save(); render(); }
    });

    function groupsInGrade(gradeId){ return state.groups.filter(function(g){ return g.gradeId===gradeId; }); }
    function groupStudents(groupId){ return state.students.filter(function(s){ return s.groupId===groupId; }); }
    function currentStudents(){ return state.selectedGroup ? groupStudents(state.selectedGroup) : []; }
    function groupLabel(g){if(!g)return"";if(g.subject&&g.section)return g.subject+" · Sección "+g.section;if(g.subject)return g.subject;if(g.section)return "Sección "+g.section;return "General";}

    function addGrade(name){if(!name||!name.trim())return null;var g={id:uid(),name:name.trim()};state.grades.push(g);scheduleSave();render();return g;}
    function deleteGrade(id){
      var groupIds = groupsInGrade(id).map(function(g){return g.id;});
      groupIds.forEach(cascadeDeleteGroupData);
      state.groups = state.groups.filter(function(g){return g.gradeId!==id;});
      state.grades = state.grades.filter(function(g){return g.id!==id;});
      if(groupIds.indexOf(state.selectedGroup)!==-1) state.selectedGroup = null;
      scheduleSave();
    }
    function addGroup(gradeId, sub, sec){if(!gradeId)return null;var g={id:uid(),gradeId:gradeId,subject:(sub||"").trim(),section:(sec||"").trim()};state.groups.push(g);state.selectedGroup=g.id;scheduleSave();render();return g;}
    function cascadeDeleteGroupData(groupId){
      var studentIds = groupStudents(groupId).map(function(s){return s.id;});
      state.students=state.students.filter(function(s){return s.groupId!==groupId;});
      state.points=state.points.filter(function(p){return studentIds.indexOf(p.studentId)===-1;});
    }
    function deleteGroup(id){
      cascadeDeleteGroupData(id);
      state.groups=state.groups.filter(function(g){return g.id!==id;});
      if(state.selectedGroup===id) state.selectedGroup = null;
      scheduleSave();
    }
    function addStudent(name){
      if(!name||!name.trim()||!state.selectedGroup)return;
      var formatted = fixNameFormat(name);
      var newSt = {id:uid(),groupId:state.selectedGroup,name:formatted};
      state.students.push(newSt);
      showUndo("Estudiante agregado.", function(){ state.students = state.students.filter(function(s){return s.id!==newSt.id;}); });
      scheduleSave(); render();
    }
    function deleteStudent(id){
      var stIndex = state.students.findIndex(function(s){return s.id===id;});
      if(stIndex===-1) return;
      var removed = state.students[stIndex];
      state.students.splice(stIndex,1);
      showUndo("Estudiante eliminado.", function(){ state.students.splice(stIndex, 0, removed); });
      scheduleSave(); render();
    }
    function addPoints(studentId, amount, reason){
      if(!studentId || !amount) return;
      var newP = {id:uid(), studentId:studentId, amount:amount, reason:(reason||"General").trim(), date:todayISO(), time:nowTimeStr()};
      state.points.push(newP);
      showUndo("Registro guardado.", function(){ state.points = state.points.filter(function(p){return p.id!==newP.id;}); });
      scheduleSave(); render();
    }

    function setAttendance(studentId, status){
      var rec = state.attendance.find(function(a){return a.groupId===state.selectedGroup && a.date===state.attendanceDate;});
      if(!rec){ rec = {id:uid(), groupId:state.selectedGroup, date:state.attendanceDate, records:{}}; state.attendance.push(rec); }
      var prevStatus = rec.records[studentId];
      if(prevStatus === status) delete rec.records[studentId];
      else rec.records[studentId] = status;
      
      showUndo("Asistencia actualizada.", function(){
        if(prevStatus) rec.records[studentId] = prevStatus;
        else delete rec.records[studentId];
      });
      scheduleSave(); render();
    }

    function el(html){var t=document.createElement("template");t.innerHTML=html.trim();return t.content.firstChild;}

    function render(){
      var app = document.getElementById("app");
      app.innerHTML = "";
      app.appendChild(renderTopbar());

      var layout = el('<div class="layout"></div>');
      layout.appendChild(renderTree());
      var mainCol = el('<div class="main-content"></div>');
      layout.appendChild(mainCol);
      app.appendChild(layout);

      var group = state.groups.find(function(g){return g.id===state.selectedGroup;});
      
      if(!group){
        mainCol.appendChild(renderHomeDashboard());
        return;
      }

      var grade = state.grades.find(function(gr){return gr.id===group.gradeId;});
      var bc = el('<div class="breadcrumb"><span class="breadcrumb-home" id="bcHome" style="cursor:pointer;color:var(--green);font-weight:600;">Inicio</span> ❯ <strong>Gestión de Grados</strong> ❯ <span class="current">'+escapeHtml(grade?grade.name:"")+' · '+escapeHtml(groupLabel(group))+'</span></div>');
      bc.querySelector("#bcHome").addEventListener("click", function(){ state.selectedGroup = null; render(); });
      mainCol.appendChild(bc);
      
      mainCol.appendChild(renderTabsRow());
      var main = el('<main></main>');
      mainCol.appendChild(main);
      switch(state.activeTab){
        case "estudiantes": main.appendChild(renderEstudiantes()); break;
        case "asistencia": main.appendChild(renderAsistencia()); break;
        case "puntos": main.appendChild(renderPuntos()); break;
        case "examenes": main.appendChild(renderExamenes()); break;
        case "reportes": main.appendChild(renderReportes()); break;
        default: main.appendChild(renderEstudiantes());
      }
    }

    function renderHomeDashboard(){
      var wrap = el('<div></div>');
      var totalStudents = state.students.length;
      var totalGroups = state.groups.length;
      var monthsNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
      
      function buildCalendarHTML(year, month){
        var firstDayIndex = new Date(year, month, 1).getDay();
        var totalDays = new Date(year, month + 1, 0).getDate();
        var holidays = {
          "2026-7-16": "Restauración", "2026-7-24": "Inicio Clases", "2026-8-24": "Ntra. Sra. Mercedes",
          "2026-10-9": "Día Constitución", "2026-11-25": "Navidad", "2027-0-1": "Año Nuevo",
          "2027-0-21": "Día Altagracia", "2027-0-25": "Duarte", "2027-1-27": "Independencia",
          "2027-2-26": "Viernes Santo", "2027-4-3": "Día del Trabajo", "2027-4-27": "Corpus Christi", "2027-5-18": "Cierre Clases"
        };

        var html = '<div class="calendar-container">'+
          '<div class="calendar-header">'+
            '<button class="btn btn-sm" id="prevMonth">◀ Mes Anterior</button>'+
            '<h3 style="margin:0; font-family:Lora,serif; color:var(--green-dark);">Calendario: '+monthsNames[month]+' '+year+'</h3>'+
            '<button class="btn btn-sm" id="nextMonth">Mes Siguiente ▶</button>'+
          '</div>'+
          '<div class="calendar-grid">'+
            '<div class="cal-day-name">Dom</div><div class="cal-day-name">Lun</div><div class="cal-day-name">Mar</div>'+
            '<div class="cal-day-name">Mié</div><div class="cal-day-name">Jue</div><div class="cal-day-name">Vie</div><div class="cal-day-name">Sáb</div>';

        var c=0;
        for(var i=0; i<firstDayIndex; i++){
          html += '<div class="cal-cell empty"></div>';
          c++;
        }

        for(var d=1; d<=totalDays; d++){
          var dateKey = year + "-" + month + "-" + d;
          var holidayText = holidays[dateKey] || "";
          var isToday = (todayISO() === (year + "-" + String(month+1).padStart(2,'0') + "-" + String(d).padStart(2,'0')));
          
          html += '<div class="cal-cell'+(isToday?" today":"")+'">'+
            '<span class="cal-date-num">'+d+'</span>'+
            (holidayText ? '<span class="cal-event-tag" title="'+escapeHtml(holidayText)+'">'+escapeHtml(holidayText)+'</span>' : '')+
          '</div>';
          c++;
        }
        html += '</div></div>';
        return html;
      }

      var dashboardHTML = el(
        '<div class="panel-head"><h2>Panel General y Calendario</h2></div>'+
        '<div class="countdown-badge">📅 Año Escolar 2026-2027 (Del 24 de agosto de 2026 al 18 de junio de 2027)</div>'+
        '<div style="background:#fff; padding:20px; border-radius:12px; box-shadow:var(--shadow-soft); margin-bottom:20px;">'+
          '<h3>📚 Mis Cursos y Resumen</h3>'+
          '<p style="font-size:13.5px;color:var(--ink-soft);margin-bottom:14px;">Tienes <strong>'+totalGroups+' asignaturas</strong> registradas con un total de <strong>'+totalStudents+' estudiantes</strong> activos.</p>'+
          (totalGroups === 0 ? '<p style="font-size:13px;color:var(--gold);">Comienza creando un grado y una asignatura en el panel izquierdo.</p>' : '<div id="quickCourseList"></div>')+
        '</div>'+
        '<div id="calendarWrapper"></div>'
      );

      wrap.appendChild(dashboardHTML);

      if(totalGroups > 0){
        var qList = wrap.querySelector("#quickCourseList");
        state.groups.forEach(function(g){
          var gr = state.grades.find(function(x){return x.id===g.gradeId;});
          var count = groupStudents(g.id).length;
          var btn = el('<button class="btn" style="width:100%;text-align:left;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;background:var(--paper-dim);"><span><strong>'+escapeHtml(gr?gr.name:"")+'</strong> · '+escapeHtml(groupLabel(g))+'</span><span class="pill pill-green">'+count+' alumnos</span></button>');
          btn.addEventListener("click", function(){ state.selectedGroup = g.id; render(); });
          qList.appendChild(btn);
        });
      }

      var calWrap = wrap.querySelector("#calendarWrapper");
      function renderCalendarWidget(){
        calWrap.innerHTML = buildCalendarHTML(state.currentCalYear, state.currentCalMonth);
        calWrap.querySelector("#prevMonth").addEventListener("click", function(){
          state.currentCalMonth--;
          if(state.currentCalMonth < 0){ state.currentCalMonth = 11; state.currentCalYear--; }
          renderCalendarWidget();
        });
        calWrap.querySelector("#nextMonth").addEventListener("click", function(){
          state.currentCalMonth++;
          if(state.currentCalMonth > 11){ state.currentCalMonth = 0; state.currentCalYear++; }
          renderCalendarWidget();
        });
      }
      renderCalendarWidget();

      return wrap;
    }

    function renderExamenes() {
      var wrap = el('<div></div>');
      var students = currentStudents();
      wrap.appendChild(el('<div class="panel-head"><h2>Evaluaciones y Calificaciones de Exámenes</h2><div class="inline-form"><input type="text" id="newExamTitle" placeholder="Nombre de la Evaluación"><button class="btn btn-primary" id="addExamBtn">Crear Examen</button></div></div>'));

      var addBtn = wrap.querySelector("#addExamBtn");
      addBtn.addEventListener("click", function(){
        var titleInput = wrap.querySelector("#newExamTitle");
        var title = titleInput.value.trim();
        if(!title || !state.selectedGroup) return;
        state.exams.push({ id: uid(), groupId: state.selectedGroup, title: title, date: todayISO() });
        titleInput.value = "";
        scheduleSave(); render();
      });

      var groupExams = state.exams.filter(function(e){ return e.groupId === state.selectedGroup; });
      if(!groupExams.length){
        wrap.appendChild(el('<div class="empty"><h2>Sin evaluaciones registradas</h2><p>Crea un examen arriba para empezar a calificar.</p></div>'));
        return wrap;
      }

      groupExams.forEach(function(ex){
        var examCard = el('<div class="card-box" style="margin-bottom:20px;">'+
          '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">'+
            '<h3 style="margin:0;">📝 '+escapeHtml(ex.title)+' <span style="font-size:12px; font-weight:normal; color:var(--ink-soft);">('+ex.date+')</span></h3>'+
            '<button class="btn btn-sm btn-danger" id="delExam_'+ex.id+'">Eliminar Examen</button>'+
          '</div>'+
          '<div class="table-wrap"><table id="tableExam_'+ex.id+'"><thead><tr><th>Estudiante</th><th class="num">Calificación (0-100)</th></tr></thead><tbody></tbody></table></div>'+
        '</div>');

        examCard.querySelector("#delExam_"+ex.id).addEventListener("click", function(){
          state.exams = state.exams.filter(function(x){ return x.id !== ex.id; });
          state.examGrades = state.examGrades.filter(function(g){ return g.examId !== ex.id; });
          scheduleSave(); render();
        });

        var tbody = examCard.querySelector("tbody");
        students.forEach(function(s){
          var gradeRecord = state.examGrades.find(function(g){ return g.examId === ex.id && g.studentId === s.id; });
          var score = gradeRecord ? gradeRecord.score : "";
          var tr = el('<tr><td><strong>'+escapeHtml(s.name)+'</strong></td><td class="num"><input type="number" min="0" max="100" value="'+score+'" style="width:80px; text-align:right; padding:4px; border:1px solid #ccc; border-radius:6px;" data-exam="'+ex.id+'" data-student="'+s.id+'"></td></tr>');
          
          tr.querySelector("input").addEventListener("change", function(e){
            var val = parseFloat(e.target.value) || 0;
            var rec = state.examGrades.find(function(g){ return g.examId === ex.id && g.studentId === s.id; });
            if(rec){ rec.score = val; }
            else { state.examGrades.push({ id: uid(), examId: ex.id, studentId: s.id, score: val }); }
            scheduleSave();
          });
          tbody.appendChild(tr);
        });

        wrap.appendChild(examCard);
      });

      return wrap;
    }

      });

      var tableWrap = el('<div class="table-wrap"></div>');
      var table = el('<table><thead><tr><th>Estudiante</th><th class="num">Total Puntos</th><th class="num">Total Faltas</th><th class="num">Balance Neto</th></tr></thead></table>');
      var tbody = document.createElement("tbody");

      students.forEach(function(s){
        var sPoints = state.points.filter(function(p){return p.studentId===s.id;});
        var pos = sPoints.filter(function(p){return p.amount>0;}).reduce(function(a,b){return a+b.amount;},0);
        var neg = sPoints.filter(function(p){return p.amount<0;}).reduce(function(a,b){return a+b.amount;},0);
        var balance = pos + neg;
        tbody.appendChild(el('<tr><td><strong>'+escapeHtml(s.name)+'</strong></td><td class="num" style="color:var(--green);">+'+pos+'</td><td class="num" style="color:var(--red);">'+neg+'</td><td class="num">'+balance+'</td></tr>'));
      });
      table.appendChild(tbody); tableWrap.appendChild(table); wrap.appendChild(tableWrap);
      return wrap;
    }

    function exportExamsToExcel() {
      var group = state.groups.find(function(g){return g.id===state.selectedGroup;});
      var students = currentStudents();
      var groupExams = state.exams.filter(function(e){ return e.groupId === state.selectedGroup; });

      var csvContent = "data:text/csv;charset=utf-8,Estudiante";
      groupExams.forEach(function(ex){ csvContent += "," + ex.title; });
      csvContent += "\n";

      students.forEach(function(s){
        var row = '"' + s.name + '"';
        groupExams.forEach(function(ex){
          var rec = state.examGrades.find(function(g){ return g.examId === ex.id && g.studentId === s.id; });
          row += "," + (rec ? rec.score : "");
        });
        csvContent += row + "\n";
      });

      var encodedUri = encodeURI(csvContent);
      var link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", "calificaciones_" + (group ? group.subject : "curso") + ".csv");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function openPrintSelectorModal(){
      var backdrop = el('<div class="modal-backdrop"></div>');
      var modal = el('<div class="modal" style="max-width:450px;">'+
        '<h3>Opciones de Impresión y Reportes</h3>'+
        '<label class="field-label">Seleccione tipo de reporte:</label>'+
        '<select id="printTypeSel" style="margin-bottom:12px;">'+
          '<option value="list">Lista Oficial de Estudiantes</option>'+
          '<option value="attendanceRange">Planilla de Asistencia (Rango de 1 a 3 meses)</option>'+
          '<option value="incidents">Reporte Detallado de Incidencias</option>'+
        '</select>'+
        '<div id="rangeInputs" style="display:none; margin-bottom:12px;">'+
          '<label class="field-label">Desde (Inicio del rango):</label><input type="date" id="printStart" value="'+todayISO()+'">'+
          '<label class="field-label" style="margin-top:6px;">Hasta (Fin del rango - Hasta 3 meses):</label><input type="date" id="printEnd" value="'+todayISO()+'">'+
        '</div>'+
        '<div class="modal-actions"><button class="btn" id="cancelPrint">Cancelar</button><button class="btn btn-primary" id="confirmPrint">Generar Impresión</button></div>'+
      '</div>');

      backdrop.appendChild(modal); document.body.appendChild(backdrop);
      var sel = modal.querySelector("#printTypeSel");
      var rangeDiv = modal.querySelector("#rangeInputs");

      sel.addEventListener("change", function(){
        if(sel.value === "attendanceRange") rangeDiv.style.display = "block";
        else rangeDiv.style.display = "none";
      });

      modal.querySelector("#cancelPrint").addEventListener("click", function(){ document.body.removeChild(backdrop); });
      modal.querySelector("#confirmPrint").addEventListener("click", function(){
        var type = sel.value;
        var start = modal.querySelector("#printStart").value;
        var end = modal.querySelector("#printEnd").value;
        document.body.removeChild(backdrop);
        preparePrintView(type, start, end);
      });
    }

    function preparePrintView(type, start, end){
      var group = state.groups.find(function(g){return g.id===state.selectedGroup;});
      var grade = group ? state.grades.find(function(gr){return gr.id===group.gradeId;}) : null;
      var students = currentStudents();

      var printDiv = document.getElementById("printAreaContainer");
      if(!printDiv){
        printDiv = document.createElement("div");
        printDiv.id = "printAreaContainer";
        printDiv.className = "print-view-only";
        document.body.insertBefore(printDiv, document.body.firstChild);
      }

      var html = '<h2 style="font-family:Lora,serif; margin-bottom:4px;">Grammateus - Reporte Oficial MINERD</h2>'+
                 '<p style="margin:0 0 15px 0; font-size:13px; color:#555;">Docente: '+escapeHtml(state.userName)+' | Grado: '+escapeHtml(grade?grade.name:"")+' | Asignatura: '+escapeHtml(groupLabel(group))+'</p>';

      if(type === 'list'){
        html += '<h3>Lista Oficial de Estudiantes</h3>'+
                '<table><thead><tr><th>No.</th><th>Nombre del Estudiante</th><th>Observaciones</th></tr></thead><tbody>';
        students.forEach(function(s, idx){
          html += '<tr><td style="width:50px;">'+(idx+1)+'</td><td><strong>'+escapeHtml(s.name)+'</strong></td><td></td></tr>';
        });
        html += '</tbody></table>';
      } else if(type === 'incidents'){
        html += '<h3>Reporte de Incidencias y Conducta</h3>'+
                '<table><thead><tr><th>Día y Hora</th><th>Estudiante</th><th>Motivo</th><th class="num">Impacto</th></tr></thead><tbody>';
        var points = state.points.filter(function(p){ return students.some(function(s){return s.id===p.studentId;}); });
        points.forEach(function(p){
          var st = students.find(function(s){return s.id===p.studentId;});
          html += '<tr><td>'+p.date+' '+(p.time||'')+'</td><td><strong>'+(st?st.name:'')+'</strong></td><td>'+p.reason+'</td><td class="num">'+p.amount+'</td></tr>';
        });
        html += '</tbody></table>';
      } else if(type === 'attendanceRange'){
        html += '<h3>Planilla de Asistencia (Rango: '+start+' al '+end+')</h3>'+
                '<p style="font-size:12px; color:#666;">Leyenda: P (Presente) | T (Tardanza) | A (Ausente) — Rango de 1 a 3 meses aplicado.</p>'+
                '<table><thead><tr><th>Estudiante</th><th>Registro Consolidado en el Rango</th></tr></thead><tbody>';
        students.forEach(function(s){
          html += '<tr><td><strong>'+escapeHtml(s.name)+'</strong></td><td>[ Periodo de Asistencia Validado: '+start+' / '+end+' ]</td></tr>';
        });
        html += '</tbody></table>';
      }

      printDiv.innerHTML = html;
      window.print();
    }

    function openGradeModal(){
      var backdrop = el('<div class="modal-backdrop"></div>');
      var modal = el('<div class="modal"><h3>Seleccionar Grado</h3><label class="field-label">Grado</label><select id="gradeNameInput"><option>1ro de Secundaria</option><option>3ro de Secundaria</option><option>4to de Secundaria</option><option>5to de Secundaria</option><option>6to de Secundaria</option></select><div class="modal-actions"><button class="btn" id="cancelGrade">Cancelar</button><button class="btn btn-primary" id="saveGrade">Guardar</button></div></div>');
      backdrop.appendChild(modal); document.body.appendChild(backdrop);
      modal.querySelector("#cancelGrade").addEventListener("click", function(){ document.body.removeChild(backdrop); });
      modal.querySelector("#saveGrade").addEventListener("click", function(){
        addGrade(modal.querySelector("#gradeNameInput").value);
        document.body.removeChild(backdrop);
      });
    }

    function openGroupModal(gradeId){
      var backdrop = el('<div class="modal-backdrop"></div>');
      var modal = el('<div class="modal"><h3>Asignatura</h3><label class="field-label">Nombre</label><input type="text" id="subInput" value="Matemática"><label class="field-label">Sección</label><input type="text" id="secInput" value="Única"><div class="modal-actions"><button class="btn" id="cancelGroup">Cancelar</button><button class="btn btn-primary" id="saveGroup">Guardar</button></div></div>');
      backdrop.appendChild(modal); document.body.appendChild(backdrop);
      modal.querySelector("#cancelGroup").addEventListener("click", function(){ document.body.removeChild(backdrop); });
      modal.querySelector("#saveGroup").addEventListener("click", function(){
        addGroup(gradeId, modal.querySelector("#subInput").value, modal.querySelector("#secInput").value);
        document.body.removeChild(backdrop);
      });
    }

    function openEditProfileModal(){
      var backdrop = el('<div class="modal-backdrop"></div>');
      var modal = el('<div class="modal"><h3>Cambiar Nombre</h3><input type="text" id="uName" value="'+escapeHtml(state.userName)+'"><div class="modal-actions"><button class="btn" id="cancelP">Cancelar</button><button class="btn btn-primary" id="saveP">Guardar</button></div></div>');
      backdrop.appendChild(modal); document.body.appendChild(backdrop);
      modal.querySelector("#cancelP").addEventListener("click", function(){ document.body.removeChild(backdrop); });
      modal.querySelector("#saveP").addEventListener("click", function(){
        state.userName = modal.querySelector("#uName").value; scheduleSave(); render();
        document.body.removeChild(backdrop);
      });
    }

    function openEditCoursesModal(){
      var backdrop = el('<div class="modal-backdrop"></div>');
      var modal = el('<div class="modal"><h3>Cursos Activos</h3><p class="hint">Gestiona tus grados y asignaturas.</p><div class="modal-actions"><button class="btn btn-primary" id="closeC">Cerrar</button></div></div>');
      backdrop.appendChild(modal); document.body.appendChild(backdrop);
      modal.querySelector("#closeC").addEventListener("click", function(){ document.body.removeChild(backdrop); });
    }

    function openStudentProfileModal(s){
      var backdrop = el('<div class="modal-backdrop"></div>');
      var modal = el('<div class="modal"><h3>'+escapeHtml(s.name)+'</h3><p class="hint">Expediente del estudiante</p><div class="modal-actions"><button class="btn btn-primary" id="closeS">Cerrar</button></div></div>');
      backdrop.appendChild(modal); document.body.appendChild(backdrop);
      modal.querySelector("#closeS").addEventListener("click", function(){ document.body.removeChild(backdrop); });
    }

    load();
  }
  window.addEventListener('DOMContentLoaded', initApp);
</script>
